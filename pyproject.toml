[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iomix-workflow"
version = "0.1.0"
description = "Declarative workflow and exact caching engine for Iomix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8.3", "ruff>=0.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
iomix-workflow = "iomix_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iomix_workflow"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
